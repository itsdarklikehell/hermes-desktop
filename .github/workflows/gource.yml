name: Gource Visualization

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@v1
        with:
          gource_title: "Hermes Desktop"
          gource_resolution: 1080p
          gource_fps: 60
          gource_font_size: 40
          gource_start_date: "2024-01-01"

      - name: Upload gource video
        uses: actions/upload-artifact@v4
        with:
          name: gource
          path: ./gource/gource.mp4
